server.port=8080
spring.application.name=kyc-prozess

# Engine-Datenbank: H2 im Arbeitsspeicher, nach einem Neustart leer
spring.datasource.url=jdbc:h2:mem:kyc;DB_CLOSE_DELAY=-1
camunda.bpm.database.schema-update=true
camunda.bpm.history-level=full
# Antrag und Laya-Ergebnis als JSON speichern (Spin), lesbar in Cockpit und REST-API
camunda.bpm.default-serialization-format=application/json
camunda.bpm.generic-properties.properties.enforce-history-time-to-live=false

# CIB seven Webclient unter /webapp/, klassisches Cockpit und Tasklist unter /camunda/app/
# Login demo / demo (Admin), Prüferin anna / anna (Gruppe kyc-reviewers, siehe DemoUsers)
camunda.bpm.admin-user.id=demo
camunda.bpm.admin-user.password=demo
camunda.bpm.admin-user.first-name=Demo
camunda.bpm.filter.create=Alle Aufgaben
# Gruppen-IDs mit Bindestrich zulassen (kyc-reviewers)
camunda.bpm.generic-properties.properties.group-resource-whitelist-pattern=[a-zA-Z0-9-]+
# "/" gehört der eigenen Weboberfläche
camunda.bpm.webapp.index-redirect-enabled=false
# Signaturschlüssel für die Anmeldung am CIB seven Webclient; nur für die lokale Demo
cibseven.webclient.authentication.jwtSecret=bPrBjGNFk0EyNDOoBXAaU3Bpx5Jhw0yOyidcd8+6sfdW5JAEPaKPnukSI09exGP20ce+w/48dDUeE5R55+qJP9tirERyYoUEbj2XkCZS5LECK2JIjyPunCz6y+SYON2qWTBaqIO2Qn5OHVn8hO9ZL65K3n7dYT0Mre7bL+rMzUggZuFrr8tDENDR06h8ePpwAAXAraxCQ4NHT2KHxiY4HQ==

# Laya-Dienst (laya_kyc/laya_service.py)
laya.url=${LAYA_URL:http://localhost:8000}
laya.connect-timeout=2s
laya.read-timeout=30s

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Weboberfläche: kein Browser-Cache, damit Änderungen nach einem Neustart sofort ankommen
spring.web.resources.cache.cachecontrol.no-cache=true
